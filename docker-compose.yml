version: '3.8'

services:
  whatsapp-bot:
    # IMAGE_TAG is injected by the deploy script (e.g. web-prod-<sha>).
    # Falls back to 'web-prod' for local dev / manual runs.
    image: neosharma995/travel-ai-agent-bot:${IMAGE_TAG:-web-prod}
    container_name: whatsapp-bot
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    volumes:
      - ./generated_pdfs:/app/generated_pdfs
      - ./logs:/app/logs
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  bot-network:
    driver: bridge