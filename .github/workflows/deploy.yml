name: Build, Push and Deploy

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: neosharma995/travel-ai-agent-bot
  DOCKER_TAG: web-prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
  
  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script: |
          cd /home/ubuntu/TRAVEL_AI_AGENT_GUIDE
          
          # Stop containers but keep volumes and networks
          echo "🛑 Stopping containers..."
          docker-compose down --remove-orphans
          
          # Remove ALL stopped containers
          echo "🧹 Cleaning up stopped containers..."
          docker container prune -f
          
          # Remove unused images (but keep volumes and networks)
          echo "🗑️ Removing unused images..."
          docker image prune -af
          
          # Completely remove old .env file
          echo "📝 Removing old .env file..."
          rm -f .env
          rm -f .env.backup.*
          
          # Create BRAND NEW .env file
          echo "✨ Creating fresh .env file with latest secrets..."
          cat > .env << 'EOF'
          # API Keys
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          
          # WhatsApp/Meta
          ACCESS_TOKEN=${{ secrets.ACCESS_TOKEN }}
          VERIFY_TOKEN=${{ secrets.VERIFY_TOKEN }}
          
          # WordPress API
          WP_API_BASE=${{ secrets.WP_API_BASE }}
          
          # Flask/Debug
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG_MODE=${{ secrets.DEBUG_MODE }}
          
          # MongoDB
          MONGODB_USER=${{ secrets.MONGODB_USER }}
          MONGODB_PASS=${{ secrets.MONGODB_PASS }}
          MONGODB_HOST=mongodb
          MONGODB_PORT=27017
          
          # Email
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          FROM_EMAIL=${{ secrets.FROM_EMAIL }}
          
          # Port
          PORT=${{ secrets.PORT || 5000 }}
          EOF
          
          # Ensure .env has correct permissions
          chmod 600 .env
          
          # Pull the absolute latest image
          echo "🐳 Pulling latest Docker image..."
          docker-compose pull
          
          # Start fresh containers (keeps existing volumes and networks)
          echo "🚀 Starting fresh containers..."
          docker-compose up -d --force-recreate --remove-orphans
          
          # Wait for containers to initialize
          echo "⏳ Waiting 10 seconds for services to start..."
          sleep 10
          
          # Show running containers
          echo "📋 Running containers:"
          docker-compose ps
          
          # Show recent logs
          echo "📝 Recent logs:"
          docker-compose logs --tail=30
          
          # Health check
          echo "🏥 Performing health check..."
          if curl -f http://localhost:${{ secrets.PORT || 5000 }}/health; then
            echo "✅ Deployment successful!"
          else
            echo "⚠️ Health check failed, checking logs..."
            docker-compose logs --tail=50
          fi
          
          echo "✅ Deployment completed at $(date)"